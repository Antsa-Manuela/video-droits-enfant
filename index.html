<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journée Internationale des Droits de l’Enfant — 25 s + 5 s</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500&family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{ --bg:#f4efe8; --ink:#2b2420; --accent:#E7336D; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#17130f; --ink:#f1e9df; }
}
:root[data-theme="dark"]{ --bg:#17130f; --ink:#f1e9df; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Gill Sans","Gill Sans MT",Cabin,Calibri,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:16px; min-height:100vh;
  padding-top:max(16px, env(safe-area-inset-top, 16px));
  padding-bottom:max(16px, env(safe-area-inset-bottom, 16px));
}

#stage{
  position:relative;
  width:min(100%, 420px, calc((100dvh - 40px) * 9 / 16));
  aspect-ratio:9 / 16;
  border-radius:14px; overflow:hidden;
  background:#007FA1; color:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  flex-shrink:0;
  container-type:inline-size; container-name:stage;
}

body.record{ padding:0; background:#000; }
body.record #stage{
  position:fixed;
  --w: min(100vw, calc(100vh * 9 / 16));
  --h: min(100vh, calc(100vw * 16 / 9));
  width: var(--w); height: var(--h);
  left: calc(50vw - var(--w) / 2);
  top:  calc(50vh - var(--h) / 2);
  border-radius:0; box-shadow:none; aspect-ratio:unset;
}

/* ============================================================
   SCÈNES — crossfade ultra fluide (1.6s + courbe organique)
   ============================================================ */
.scene{
  position:absolute; inset:0;
  opacity:0;
  transform: scale(1.015);
  transition:
    opacity  1.6s cubic-bezier(0.65, 0, 0.35, 1),
    transform 1.6s cubic-bezier(0.65, 0, 0.35, 1);
  will-change: opacity, transform;
  display:flex; flex-direction:column; justify-content:center;
  padding:clamp(16px, 5cqw, 28px) clamp(14px, 5cqw, 26px);
}
.scene.on{
  opacity:1;
  transform: scale(1);
}
.scene.fin{ justify-content:flex-start; padding-top:clamp(40px, 14cqw, 80px); }

/* Coupe instantanée de la transition lors du retour au début de la boucle */
.scene.no-trans,
.scene.no-trans .bg,
.scene.no-trans .bg img.photo,
.scene.no-trans .color-veil,
.scene.no-trans .w,
.scene.no-trans .line,
.scene.no-trans p {
  transition: none !important;
}

.bg{
  position:absolute; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.32) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 80%, rgba(255,255,255,.26) 0%, transparent 60%),
    #007FA1;
  transform: scale(1);
  transition: transform 9s ease-out;
  will-change: transform;
}
.scene.on .bg{ transform: scale(1.1); }

.bg i{
  position:absolute; border-radius:50%; opacity:.42; background:#fff;
  animation:drift 6s ease-in-out infinite alternate;
}
.bg i:nth-child(1){ width:200px; height:200px; left:-50px; top:70px; }
.bg i:nth-child(2){
  width:230px; height:230px; right:-70px; bottom:50px;
  animation-duration:7.5s; animation-direction:alternate-reverse;
}
@keyframes drift{
  from{ transform:translate(0,0) scale(1); }
  to  { transform:translate(14px,-18px) scale(1.06); }
}

.bg b{
  position:absolute; bottom:-12px; width:9px; height:9px;
  border-radius:50%; opacity:0; background:#fff;
}
.scene.on .bg b{ animation:rise 6s ease-in infinite; }
@keyframes rise{
  0%{transform:translateY(0); opacity:0}
  15%{opacity:.8}
  100%{transform:translateY(-560px) translateX(14px); opacity:0}
}

/* Photo : révélation flou → net en 1.6s (aligné sur la scène) */
.bg img.photo{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:2;
  filter: blur(8px);
  transform: scale(1.08);
  opacity: 0;
  transition:
    filter 1.6s cubic-bezier(0.65, 0, 0.35, 1),
    transform 1.6s cubic-bezier(0.65, 0, 0.35, 1),
    opacity 1.2s ease-out;
  will-change: filter, transform, opacity;
}
.scene.on .bg img.photo{
  filter: blur(0);
  transform: scale(1.06);
  opacity: 1;
}

/* Voile bleu nuit + léger reflet #007FA1 : contraste fort pour le texte #E7336D */
.color-veil{
  position:absolute; inset:0; z-index:3;
  background:
    linear-gradient(180deg, rgba(8,20,32,.50) 0%, rgba(8,20,32,.62) 50%, rgba(8,20,32,.52) 100%),
    rgba(0,127,161,.18);
  opacity:0;
  transition: opacity 1.2s cubic-bezier(0.65, 0, 0.35, 1);
  pointer-events:none;
}
.scene.has-photo .color-veil{ opacity:1; }

/* Scène finale : texte en haut, donc voile plus foncé en haut */
.scene.fin .color-veil{
  background:
    linear-gradient(180deg, rgba(8,20,32,.72) 0%, rgba(8,20,32,.55) 45%, rgba(8,20,32,.25) 100%),
    rgba(0,127,161,.18);
}

.logo-slot{
  position:absolute;
  left:50%; bottom:clamp(30px, 12cqw, 60px);
  transform:translateX(-50%); z-index:4;
  display:flex; align-items:center; justify-content:center;
}
.logo-slot img{
  max-height:clamp(40px, 14cqw, 70px);
  max-width:clamp(120px, 40cqw, 200px);
  display:block;
}

.tt{position:relative; z-index:4}

h1,h2{
  margin:0;
  font-family:"Gill Sans Condensed","Gill Sans MT Condensed","Pathway Gothic One","Arial Narrow",sans-serif;
  text-transform:uppercase; font-weight:400;
  line-height:1; letter-spacing:.01em;
  text-shadow:0 2px 14px rgba(0,0,0,.45);
}
h1{ font-size:clamp(28px, 16cqw, 60px); }
h2{ font-size:clamp(22px, 13cqw, 48px); }

/* Texte accentué #E7336D : sans ombre */
.accent{
  color:var(--accent);
  font-weight:700;
  text-shadow:none;
}
p .accent{
  font-weight:700;
  text-shadow:none;
}

.w{
  display:inline-block; margin-right:.22em;
  opacity:0;
  transform:translateY(30px) rotate(-4deg) scale(.88);
}
.scene.on .w{
  opacity:1; transform:none;
  transition:
    transform .85s cubic-bezier(.34,1.56,.64,1) var(--d),
    opacity   .5s ease var(--d);
}
.scene.on h1, .scene.on h2{ animation:bob 3.4s ease-in-out 1.8s infinite alternate; }
@keyframes bob{ from{transform:translateY(0)} to{transform:translateY(-4px)} }

.line{
  height:5px; width:70px; margin-top:14px; border-radius:3px;
  background:#fff; transform:scaleX(0); transform-origin:left;
  box-shadow:none;
}
.scene.on .line{
  transform:scaleX(1);
  transition:transform .8s cubic-bezier(.34,1.56,.64,1) 1s;
}

p{
  margin:14px 0 0;
  font-size:clamp(13px, 4.2cqw, 17px);
  line-height:1.35; font-weight:500;
  text-shadow:0 1px 8px rgba(0,0,0,.48);
  opacity:0; transform:translateY(12px);
}
.scene.on p{ opacity:1; transform:none; transition:all .8s ease 1.1s; }

.scene.on.fin h2{ animation:pulse 1.6s ease-in-out 1.8s infinite alternate; }
@keyframes pulse{ from{transform:scale(1)} to{transform:scale(1.03)} }

/* ============================================================
   UI ENREGISTREMENT (visible avec ?record=1)
   ============================================================ */
#rec-ui{
  position:fixed; bottom:20px; left:50%;
  transform:translateX(-50%);
  z-index:99;
  display:none;
  flex-direction:column; align-items:center; gap:8px;
  padding:14px 22px;
  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;
  color:#fff;
  font-family:Cabin, sans-serif;
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
body.record #rec-ui{ display:flex; }
#rec-btn{
  font:600 16px Cabin, sans-serif;
  padding:12px 26px;
  border:0; border-radius:999px;
  background:#E7336D; color:#fff;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(231,51,109,.55);
  transition: transform .15s, background .2s;
}
#rec-btn:hover{ transform:scale(1.04); background:#d02860; }
#rec-btn:disabled{ background:#666; box-shadow:none; cursor:wait; }
#rec-status{ font-size:13px; opacity:.9; max-width:340px; line-height:1.4; }

@media (prefers-reduced-motion:reduce){
  .scene.on h1, .scene.on h2,
  .bg i, .scene.on .bg b{ animation:none; }
  .scene, .bg, .bg img.photo{ transition-duration: .01s; }
}
</style>
</head>
<body>

<div id="stage"></div>

<div id="rec-ui">
  <button id="rec-btn">🔴 Enregistrer 60 s</button>
  <div id="rec-status">
    Cliquez → choisissez <b>« Cet onglet »</b> dans la fenêtre<br>
    et cochez <b>« Partager l'audio de l'onglet »</b>.
  </div>
</div>

<script>
if (location.search.includes('record=1')) document.body.classList.add('record');

/* ============================================================
   SCÈNES  [début, fin, balise, titre, sous-titre, image]
   Utilisez *mot* pour colorer un mot ou une courte expression en #E7336D
   ============================================================ */
const SEQ_END = 25;        // fin de la séquence animée (dernière scène)
const PAUSE   = 5;         // pause avant de boucler
const END     = SEQ_END + PAUSE;   // 30 s par boucle
const RECORD_DURATION = 60;        // durée d'enregistrement (secondes)
const LOGO_SRC = "asmae mada.jpg";
const AUDIO_SRC = "Audio.mp3";

const S = [
  [0, 4,  "h1", "CHAQUE ENFANT MÉRITE UN MONDE À SA *HAUTEUR*", "*20 novembre* · Journée Internationale des Droits de l’Enfant", "sourire2.jpg"],
  [4, 7,  "h2", "DES MILLIONS D'ENFANTS ATTENDENT *ENCORE*",  "d'être en *sécurité*.", "regard.jpg"],
  [7, 10, "h2", "UN DROIT : *APPRENDRE*",                     "Une école, un livre, un maître.", "cahier.png"],
  [10, 13,"h2", "UN DROIT : ÊTRE *PROTÉGÉ*",                  "Contre la violence, la faim et la peur.", "etude.jpg"],
  [13, 16,"h2", "UN DROIT : ÊTRE *ÉCOUTÉ*",                   "Leur *voix* compte. Entendons-la.", "ecoute.jfif"],
  [16, 20,"h1", "AGISSONS, *ENSEMBLE*",                       "Parents, enseignants, citoyens : l'espoir est collectif.", "agir.jfif"],
  [20, 22,"h1", "UN AVENIR SANS *PEUR*",                      "*Dignité* · Éducation · Sécurité", "coudre.jpg"],
  [22, 25,"h2", "*PARTAGEZ.* FAITES ENTENDRE LEUR VOIX.",     "Partagez sur Facebook · *#JournéeInternationaleDesDroitsDeLEnfant*", "smile.jpg"]
];

/* ============================================================
   CONSTRUCTION DES SCÈNES
   ============================================================ */
const stage = document.getElementById('stage');

function formatTitleWords(raw) {
  const tokens = raw.split(/\s+/).filter(Boolean);
  let inAccent = false;

  return tokens.map((token, i) => {
    let startsAccent = false;
    let endsAccent = false;
    let clean = token;

    if (clean.startsWith('*')) {
      startsAccent = true;
      inAccent = true;
      clean = clean.slice(1);
    }
    if (clean.endsWith('*')) {
      endsAccent = true;
      clean = clean.slice(0, -1);
    }

    const applyAccent = inAccent || startsAccent;
    if (endsAccent) inAccent = false;

    const inner = applyAccent ? `<span class="accent">${clean}</span>` : clean;
    return `<span class="w" style="--d:${(0.25 + i * 0.1).toFixed(2)}s">${inner}</span>`;
  }).join('');
}

function formatSubtext(raw) {
  return raw.replace(/\*([^*]+)\*/g, '<span class="accent">$1</span>');
}

const els = S.map(([a, b, tagName, title, sub, img], n) => {
  const isFin = (n === S.length - 1);
  const d = document.createElement('div');
  d.className = 'scene'
    + (n % 2 ? ' alt' : '')
    + (isFin ? ' fin' : '')
    + (img ? ' has-photo' : '');

  const words = formatTitleWords(title);
  const formattedSub = formatSubtext(sub);

  let dots = '';
  for (let k = 0; k < 9; k++) {
    dots += `<b style="left:${(k*11+6)%96}%; animation-delay:${(k*0.7%5).toFixed(1)}s; animation-duration:${5+k%3}s"></b>`;
  }

  const photo    = img ? `<img class="photo" src="${img}" alt="">` : '';
  const logoSlot = isFin ? `<div class="logo-slot"><img src="${LOGO_SRC}" alt="Logo"></div>` : '';

  d.innerHTML = `
    <div class="bg">
      ${photo}
      <i></i><i></i>
      ${dots}
    </div>
    <div class="color-veil"></div>
    <div class="tt">
      <${tagName}>${words}</${tagName}>
      <div class="line"></div>
      <p>${formattedSub}</p>
    </div>
    ${logoSlot}
  `;
  stage.appendChild(d);
  return d;
});

/* ============================================================
   LECTEUR
   ============================================================ */
let t = 0, playing = true, last = 0, cur = -1;
let isLoopReset = false;

function render() {
  const i = (t >= SEQ_END)
    ? S.length - 1
    : S.findIndex(s => t >= s[0] && t < s[1]);

  if (i !== cur) {
    if (isLoopReset) {
      els.forEach(e => e.classList.add('no-trans'));
      els.forEach((e, k) => e.classList.toggle('on', k === i));
      void stage.offsetWidth;
      els.forEach(e => e.classList.remove('no-trans'));
      isLoopReset = false;
    } else {
      els.forEach((e, k) => e.classList.toggle('on', k === i));
    }
    cur = i;
  }
}

/* ============================================================
   AUDIO (Audio.mp3)
   ============================================================ */
let bgAudio = null, muted = false, audioReady = false;

function audioInit() {
  if (bgAudio) return;
  try {
    bgAudio = new Audio(AUDIO_SRC);
    bgAudio.loop = true;
    bgAudio.preload = 'auto';
    bgAudio.volume = 0;
  } catch (e) {}
}

function startAudioIfPossible() {
  audioInit();
  if (!bgAudio) return;
  bgAudio.play().then(() => {
    audioReady = true;
  }).catch(() => {});
}

function music() {
  if (!bgAudio) return;

  if (muted || t >= SEQ_END) {
    const nextVol = Math.max(0, bgAudio.volume - 0.08);
    bgAudio.volume = nextVol;
    if (nextVol === 0 && !bgAudio.paused && t >= SEQ_END) {
      bgAudio.pause();
    }
    return;
  }

  if (bgAudio.paused && audioReady) {
    bgAudio.play().catch(() => {});
  }

  const fadeIn = Math.min(t / 1.0, 1);
  const fadeOut = t > SEQ_END - 1.2 ? Math.max(0, (SEQ_END - t) / 1.2) : 1;
  const targetVol = 0.85 * fadeIn * fadeOut;
  bgAudio.volume += (targetVol - bgAudio.volume) * 0.15;
}

function tick(n){
  if(playing){
    t += (n-last)/1000;
    if(t >= END){ 
      t = 0; 
      cur = -1; 
      isLoopReset = true;
      if (bgAudio) {
        try { bgAudio.currentTime = 0; } catch (_) {}
      }
    }
  }
  last = n;
  render();
  if(playing) music();
  requestAnimationFrame(tick);
}

['click','touchstart','keydown'].forEach(ev => {
  document.addEventListener(ev, () => {
    startAudioIfPossible();
  }, { once: true });
});

/* ============================================================
   PRÉCHARGEMENT
   ============================================================ */
let animStarted = false;
function startAnim() {
  if (animStarted) return;
  animStarted = true;
  audioInit();
  startAudioIfPossible();
  requestAnimationFrame(n => { last = n; tick(n); });
}

const allImgs = [...new Set([...S.map(s => s[5]).filter(Boolean), LOGO_SRC])];
let loadedCount = 0;
allImgs.forEach(src => {
  const im = new Image();
  im.onload = im.onerror = () => {
    if (++loadedCount === allImgs.length) startAnim();
  };
  im.src = src;
});
setTimeout(startAnim, 6000);

/* ============================================================
   ENREGISTREMENT INTÉGRÉ — durée RECORD_DURATION (60 s)
   ============================================================ */
const recBtn    = document.getElementById('rec-btn');
const recStatus = document.getElementById('rec-status');

recBtn.onclick = async () => {
  audioInit();
  if (bgAudio) {
    try {
      bgAudio.currentTime = 0;
      bgAudio.volume = 0.85;
      await bgAudio.play();
      audioReady = true;
    } catch (e) {}
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30,
        width:  { ideal: 1080 },
        height: { ideal: 1920 }
      },
      audio: true
    });
  } catch (e) {
    recStatus.innerHTML =
      '❌ Partage refusé. <br>Autorise le partage d\'onglet pour lancer l\'enregistrement.';
    return;
  }

  const candidates = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  const mimeType = candidates.find(m => {
    try { return MediaRecorder.isTypeSupported(m); } catch(_) { return false; }
  }) || '';

  const rec = new MediaRecorder(stream, {
    mimeType: mimeType || undefined,
    videoBitsPerSecond: 10_000_000,
    audioBitsPerSecond: 128_000
  });

  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

  rec.onstop = () => {
    const type = (mimeType || 'video/webm').split(';')[0];
    const ext  = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const url  = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'journee-internationale-droits-enfant.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    stream.getTracks().forEach(tr => tr.stop());

    recStatus.innerHTML =
      '✅ <b>Vidéo téléchargée</b> : journee-internationale-droits-enfant.' + ext +
      (ext === 'webm'
        ? '<br><small>Format WebM — convertis en MP4 sur <a href="https://cloudconvert.com/webm-to-mp4" target="_blank" style="color:#fff">cloudconvert.com/webm-to-mp4</a>.</small>'
        : '<br><small>Prêt à uploader directement sur Facebook 🎉</small>');

    recBtn.disabled = false;
    recBtn.textContent = '🔴 Enregistrer 60 s';
  };

  recBtn.disabled = true;
  recBtn.textContent = '⏺ Enregistrement…';
  recStatus.textContent = 'Ne touche plus à la page pendant ' + RECORD_DURATION + ' s.';

  t = 0; cur = -1;
  els.forEach(e => e.classList.remove('on'));

  rec.start();
  setTimeout(() => rec.stop(), RECORD_DURATION * 1000);
};
</script>
</body>
</html>

name: Generer video HD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installer Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generer la video Full HD
        run: node render-video.cjs

      - name: Recuperer la video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-droits-enfant-HD
          path: output/journee-droits-enfant.mp4
          if-no-files-found: error
          retention-days: 7


name: Generer video HD

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: |
          npm init -y
          npm install playwright

      - name: Installer Chromium et FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            pulseaudio-utils

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Generer la video
        run: |
          set -e

          pulseaudio --start --exit-idle-time=-1
          sleep 2

          pactl load-module module-null-sink sink_name=virtual_speaker

          python3 -m http.server 8000 \
            --bind 127.0.0.1 &
          SERVER_PID=$!

          sleep 3

          PULSE_SINK=virtual_speaker node render-video.cjs

          kill $SERVER_PID || true

      - name: Verifier la video
        run: |
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/journee-droits-enfant.mp4

      - name: Telecharger la video
        uses: actions/upload-artifact@v4
        with:
          name: video-droits-enfant-HD
          path: output/journee-droits-enfant.mp4
          if-no-files-found: error
          retention-days: 7
